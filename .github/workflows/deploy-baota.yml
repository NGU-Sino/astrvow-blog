name: Build and Deploy to Baota

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build site
        env:
          KEYSTATIC_GITHUB_CLIENT_ID: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_ID }}
          KEYSTATIC_GITHUB_CLIENT_SECRET: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_SECRET }}
          KEYSTATIC_SECRET: ${{ secrets.KEYSTATIC_SECRET }}
        run: pnpm run build

      - name: Copy ecosystem config to dist
        run: cp ecosystem.config.cjs dist/

      - name: Deploy to Baota
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.BAOTA_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.BAOTA_HOST }}
          REMOTE_USER: "blog-deploy"
          TARGET: "/www/wwwroot/20.2.139.66/dist/"
          SCRIPT_AFTER: |
            cd /www/wwwroot/20.2.139.66
            npm install react react-dom @keystatic/core @keystatic/astro 2>/dev/null
            # 修复 Keystatic OAuth token 交换兼容性问题
            # 修复 GitHub OAuth scope 权限（请求 public_repo scope）
            sudo sed -i '/url.searchParams.set("redirect_uri".*);/a\  url.searchParams.set("scope", "public_repo");' node_modules/@keystatic/core/dist/keystatic-core-api-generic.node.js 2>/dev/null
            sudo sed -i 's/expires: new Date(Date.now() + tokenData.expires_in ?? 3600 \* 1000)/expires: new Date(Date.now() + (tokenData.expires_in ?? 3600) * 1000)/' node_modules/@keystatic/core/dist/keystatic-core-api-generic.node.js 2>/dev/null
            sudo sed -i 's/expires: new Date(Date.now() + tokenData.refresh_token_expires_in ?? 3600 \* 100)/expires: new Date(Date.now() + (tokenData.refresh_token_expires_in ?? 3600) * 100)/' node_modules/@keystatic/core/dist/keystatic-core-api-generic.node.js 2>/dev/null
            sudo sed -i 's/await encryptValue(tokenData.refresh_token, config.secret)/await encryptValue(tokenData.refresh_token ?? "", config.secret)/' node_modules/@keystatic/core/dist/keystatic-core-api-generic.node.js 2>/dev/null
            # 修复 Astro Node adapter 协议检测（确保 HTTPS，模式匹配替代行号）
            sudo sed -i 's/const protocol = "encrypted" in req.socket && req.socket.encrypted ? "https" : "http"/const protocol = "https"/' dist/server/entry.mjs 2>/dev/null
            pm2 delete blog-astrvow 2>/dev/null
            KEYSTATIC_GITHUB_CLIENT_ID="${{ secrets.KEYSTATIC_GITHUB_CLIENT_ID }}" \
            KEYSTATIC_GITHUB_CLIENT_SECRET="${{ secrets.KEYSTATIC_GITHUB_CLIENT_SECRET }}" \
            KEYSTATIC_SECRET="${{ secrets.KEYSTATIC_SECRET }}" \
            pm2 start dist/ecosystem.config.cjs
            pm2 save